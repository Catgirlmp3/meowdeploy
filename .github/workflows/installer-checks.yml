name: Installer checks

on:
  push:
    branches:
      - feature/windows-recovery-relay
    paths:
      - "deployment/*.sh"
      - ".github/workflows/installer-checks.yml"
  workflow_dispatch:

jobs:
  shell-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: |
          bash -n deployment/install-node.sh
          bash -n deployment/install-agent.sh
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: deployment
          severity: warning
